# Copy to secrets.yaml, fill in real values, and apply — do not commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: doculedger-secrets
  namespace: doculedger
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@your-postgres-host:5432/doculedger"
  REDIS_URL: "redis://your-redis-host:6379"
  JWT_ACCESS_SECRET: "replace-with-a-long-random-secret"
  JWT_REFRESH_SECRET: "replace-with-a-different-long-random-secret"
  STORAGE_ENDPOINT: "https://s3.amazonaws.com"
  STORAGE_REGION: "us-east-1"
  STORAGE_BUCKET: "your-doculedger-bucket"
  STORAGE_ACCESS_KEY_ID: "..."
  STORAGE_SECRET_ACCESS_KEY: "..."
  STELLAR_MODE: "soroban"
  STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  STELLAR_CONTRACT_ID: "..."
  STELLAR_OPERATOR_SECRET: "..."
  STELLAR_NETWORK_LABEL: "testnet"
