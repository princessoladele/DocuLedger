apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doculedger-api
  namespace: doculedger
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: doculedger-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doculedger-worker
  namespace: doculedger
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: doculedger-worker }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # CPU is a reasonable default since OCR is CPU-bound; for tighter
    # control, replace with a custom metric on BullMQ queue depth (e.g.
    # via KEDA's Redis scaler watching the `ocr-extraction` queue length).
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } }
