apiVersion: apps/v1
kind: Deployment
metadata:
  name: doculedger-web
  namespace: doculedger
  labels: { app: doculedger-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: doculedger-web }
  template:
    metadata:
      labels: { app: doculedger-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/doculedger-web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_URL, value: "https://api.yourdomain.com/v1" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: doculedger-web
  namespace: doculedger
spec:
  selector: { app: doculedger-web }
  ports: [{ port: 80, targetPort: 3000 }]
