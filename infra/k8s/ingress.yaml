apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doculedger
  namespace: doculedger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "30m" # allow document uploads up to MAX_UPLOAD_BYTES
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.yourdomain.com, app.yourdomain.com]
      secretName: doculedger-tls
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: doculedger-api, port: { number: 80 } } }
    - host: app.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: doculedger-web, port: { number: 80 } } }
