version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql://doculedger:doculedger@postgres:5432/doculedger
  REDIS_URL: redis://redis:6379
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: doculedger-documents
  STORAGE_ACCESS_KEY_ID: doculedger
  STORAGE_SECRET_ACCESS_KEY: doculedger-secret
  STORAGE_FORCE_PATH_STYLE: "true"
  STELLAR_MODE: ${STELLAR_MODE:-mock}
  STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
  STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
  STELLAR_CONTRACT_ID: ${STELLAR_CONTRACT_ID:-}
  STELLAR_OPERATOR_SECRET: ${STELLAR_OPERATOR_SECRET:-}
  STELLAR_NETWORK_LABEL: ${STELLAR_NETWORK_LABEL:-testnet}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doculedger
      POSTGRES_PASSWORD: doculedger
      POSTGRES_DB: doculedger
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doculedger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doculedger
      MINIO_ROOT_PASSWORD: doculedger-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 doculedger doculedger-secret &&
      mc mb -p local/doculedger-documents &&
      mc anonymous set none local/doculedger-documents &&
      mc encrypt set sse-s3 local/doculedger-documents &&
      echo 'bucket ready'"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://doculedger:doculedger@postgres:5432/doculedger
    working_dir: /repo
    command: ["pnpm", "--filter", "@doculedger/database", "exec", "prisma", "migrate", "deploy"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      PORT: "4000"
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      NODE_ENV: production
      WORKER_CONCURRENCY: "4"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
